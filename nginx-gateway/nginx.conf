events {}

http {
    # Pool de middlewares. Sin directiva extra, nginx reparte con
    # round robin. max_fails/fail_timeout: si una instancia falla 3 veces
    # seguidas, nginx deja de enviarle tráfico durante 30s.
    upstream middleware_pool {
        server middleware-1:8080 max_fails=3 fail_timeout=30s;
        server middleware-2:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        # /scan (síncrono) y /jobs (cola Kafka) se reenvían al pool de middlewares.
        location ~ ^/(scan|jobs) {
            proxy_pass http://middleware_pool;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Muestra qué middleware atendió la petición.
            add_header X-Upstream $upstream_addr always;
        }

        location /health {
            return 200 "nginx gateway alive";
        }
    }
}
